<svg xmlns="http://www.w3.org/2000/svg" width="780" height="622" viewBox="0 0 780 622" role="img" aria-label="Diagram of layouts in Sunny, Notch&#x27;s template engine. index.html declares #layout :base.html and fills the title block. Pass 1 registers base.html&#x27;s slots and checks the child&#x27;s block names; pass 2 renders the child into a blocks map, then renders the layout with the slots filled, producing a page with the title &#x27;Home | My App&#x27; and &#x27;Hello, world!&#x27;. A misspelled block name fails in pass 1 with a diagnostic pointing at the line.">
