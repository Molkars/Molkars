<text x="394" y="386" class="code xs termdim a31" xml:space="preserve">#content footer with   (in bad.html)</text>
<text x="394" y="406" class="code xs termt a32" xml:space="preserve">   --&gt; bad.html:2:1</text>
<text x="394" y="426" class="code xs termt a33" xml:space="preserve">    |</text>
<text x="394" y="446" class="code xs termt a34" xml:space="preserve">  2 | #content footer with</text>
<text x="394" y="466" class="code xs termerr a35" xml:space="preserve">    | ^^^^^^^^</text>
<text x="394" y="486" class="code xs termt a36" xml:space="preserve">    |</text>
<text x="394" y="506" class="code xs termerr a37" xml:space="preserve">note: no block named "footer" in the layout</text>
<text x="394" y="526" class="code xs termerr a38" xml:space="preserve">      template</text>
<text x="20" y="574" class="s" text-anchor="start">Pass 1 runs before any output exists, so a typo in a block name never produces a half-rendered page.</text>
<text x="20" y="604" class="cap a39" text-anchor="start">Pass 1: the layout registers its slots, and every #content block in the child is checked against them …</text>
<text x="20" y="604" class="cap a40" text-anchor="start">Pass 2: the child renders into the shared blocks map; ${ … } runs through the full Notch parser …</text>
<text x="20" y="604" class="cap a41" text-anchor="start">… then the layout renders, swapping each #content slot for the child&#x27;s block (or its default).</text>
<text x="20" y="604" class="cap a42" text-anchor="start">A misspelled block fails in pass 1 with a diagnostic that points at the exact line.</text>
</svg>
