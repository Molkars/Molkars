<svg xmlns="http://www.w3.org/2000/svg" width="780" height="612" viewBox="0 0 780 612" role="img" aria-label="Diagram of a JVM bytecode generator for CatScript. AST nodes call ByteCodeGenerator, whose BytecodeBuilder tracks a stack of types. Compiling 1 + &quot;cats&quot; with iAdd pushes int and String, so IADD is rejected with &#x27;String is not assignable to int&#x27;, and getSource() walks the stack trace so the error points at the student&#x27;s AdditiveExpression.java line 104.">
