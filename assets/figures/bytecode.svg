<text x="30" y="236" class="code sm" xml:space="preserve"><tspan class="cm">101  </tspan><tspan class="k">public void </tspan><tspan class="f">compile</tspan>(ByteCodeGenerator code) {</text>
<text x="30" y="260" class="code sm" xml:space="preserve"><tspan class="cm">102  </tspan>    getLeftHandSide().<tspan class="f">compile</tspan>(code);</text>
<text x="30" y="284" class="code sm" xml:space="preserve"><tspan class="cm">103  </tspan>    getRightHandSide().<tspan class="f">compile</tspan>(code);</text>
<text x="30" y="308" class="code sm" xml:space="preserve"><tspan class="cm">104  </tspan>    code.<tspan class="f">iAdd</tspan>();</text>
<text x="30" y="332" class="code sm" xml:space="preserve"><tspan class="cm">105  </tspan>}</text>
<text x="376" y="308" class="code sm badt a16" text-anchor="end">← reported here</text>
<g class="a17"><rect class="chip" x="406" y="220" width="144" height="34" rx="5"/><text x="416" y="235" class="code sm">LDC 1</text><text x="416" y="249" class="s">→ int</text></g>
<g class="a18"><rect class="chip" x="406" y="260" width="144" height="34" rx="5"/><text x="416" y="275" class="code sm">LDC &quot;cats&quot;</text><text x="416" y="289" class="s">→ String</text></g>
<g class="a19"><rect class="chip" x="406" y="300" width="144" height="34" rx="5"/><text x="416" y="315" class="code sm">IADD</text><text x="416" y="329" class="s">int, int → int</text></g>
<rect class="bad a20" x="406" y="300" width="144" height="34" rx="5"/>
<text x="540" y="322" class="code badt b a21" text-anchor="end">✗</text>
<path class="edge" d="M595.0 342 H735.0"/>
<g class="a22"><rect class="chip" x="605.0" y="308" width="120" height="30" rx="5"/><text x="665.0" y="328" class="code sm" text-anchor="middle">int</text></g>
<g class="a23"><rect class="chip" x="605.0" y="274" width="120" height="30" rx="5"/><text x="665.0" y="294" class="code sm" text-anchor="middle">String</text></g>
<rect class="bad a24" x="605.0" y="274" width="120" height="30" rx="5"/>
<text x="665.0" y="262" class="sm badt b a25" text-anchor="middle">IADD expects int</text>
<text x="665.0" y="262" class="s a26" text-anchor="middle">checking top of stack…</text>
<text x="20" y="384" class="lbl" text-anchor="start">WHAT THE STUDENT SEES</text>
<rect class="term" x="20" y="392" width="740" height="62" rx="6"/>
<text x="34" y="416" class="code sm termerr a27">java.lang.IllegalArgumentException: String is not assignable to int</text>
<text x="34" y="436" class="code sm termt a28" xml:space="preserve">  at: csci468.parser.expressions.AdditiveExpression.compile(AdditiveExpression.java:104)</text>
<text x="34" y="426" class="code sm termdim a29">$ ./gradlew test</text>
<text x="20" y="486" class="lbl" text-anchor="start">HOW IT FINDS THAT LINE  —  getSource() walks the live stack trace</text>
<rect class="chip" x="20.0" y="494" width="102.5" height="28" rx="5"/>
<rect class="hl a31" x="20.0" y="494" width="102.5" height="28" rx="5"/>
<text x="71.225" y="512.5" class="code xs" text-anchor="middle">getStackTrace</text>
<path class="edge " d="M123.5 508 H129.4" marker-end="url(#arr)"/>
<rect class="chip" x="130.4" y="494" width="195.6" height="28" rx="5"/>
<rect class="hl a32" x="130.4" y="494" width="195.6" height="28" rx="5"/>
<text x="228.225" y="512.5" class="code xs" text-anchor="middle">ByteCodeGenerator.getSource</text>
<path class="edge " d="M327.0 508 H333.0" marker-end="url(#arr)"/>
<rect class="chip" x="334.0" y="494" width="162.3" height="28" rx="5"/>
<rect class="hl a33" x="334.0" y="494" width="162.3" height="28" rx="5"/>
<text x="415.15" y="512.5" class="code xs" text-anchor="middle">ByteCodeGenerator.iAdd</text>
<path class="edge " d="M497.3 508 H503.3" marker-end="url(#arr)"/>
<rect class="chip" x="504.3" y="494" width="215.5" height="28" rx="5"/>
<rect class="bad a34" x="504.3" y="494" width="215.5" height="28" rx="5"/>
<text x="612.05" y="512.5" class="code xs" text-anchor="middle">AdditiveExpression.compile:104</text>
<path class="edge " d="M720.8 508 H726.8" marker-end="url(#arr)"/>
<rect class="chip" x="727.8" y="494" width="22.6" height="28" rx="5"/>
<rect class="hl a35" x="727.8" y="494" width="22.6" height="28" rx="5"/>
<text x="739.125" y="512.5" class="code xs" text-anchor="middle">…</text>
<text x="20" y="540" class="s" text-anchor="start">Every instruction records the first frame after the last ByteCodeGenerator frame: the caller, not the library.</text>
<text x="20" y="556" class="s a36"><tspan class="badt b">red</tspan> = the frame reported in the error · <tspan style="fill:#4493f8" class="b">blue</tspan> = generator frames that get skipped</text>
<text x="20" y="594" class="cap a37" text-anchor="start">Each AST node compiles itself by calling the generator; every instruction declares the types it pops and pushes …</text>
<text x="20" y="594" class="cap a38" text-anchor="start">… so the builder tracks a stack of types. IADD needs two ints but finds a String, so it&#x27;s rejected …</text>
<text x="20" y="594" class="cap a39" text-anchor="start">… with an error message a student can act on …</text>
<text x="20" y="594" class="cap a40" text-anchor="start">… that points at their own line, because getSource() skips every frame inside the generator.</text>
</svg>
