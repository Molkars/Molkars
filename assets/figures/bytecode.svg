<text x="20" y="34" class="h" text-anchor="start">CatScript → JVM bytecode, with a type checker in the loop</text>
<text x="20" y="54" class="m" text-anchor="start">A bytecode generator I built for MSU&#x27;s compilers course: it checks every instruction before the JVM does.</text>
<text x="20" y="82" class="lbl" text-anchor="start">PIPELINE</text>
