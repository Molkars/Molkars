<text x="87.0" y="126" class="s" text-anchor="middle">node.compile(code)</text>
<text x="239.0" y="110" class="b" text-anchor="middle">ByteCodeGenerator</text>
<text x="239.0" y="126" class="s" text-anchor="middle">push · iAdd · jumpTo …</text>
<text x="391.0" y="110" class="b" text-anchor="middle">BytecodeBuilder</text>
<text x="391.0" y="126" class="s" text-anchor="middle">basic blocks + type stack</text>
<text x="543.0" y="110" class="b" text-anchor="middle">ASM ClassWriter</text>
<text x="543.0" y="126" class="s" text-anchor="middle">.class bytes</text>
<text x="695.0" y="110" class="b" text-anchor="middle">DynamicClassLoader</text>
<text x="695.0" y="126" class="s" text-anchor="middle">load and run</text>
