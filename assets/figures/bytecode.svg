<text x="20" y="158" class="s" text-anchor="start">Every Instruction declares the types it pops and pushes; the builder checks them the moment each one is emitted.</text>
<text x="20" y="198" class="lbl" text-anchor="start">STUDENT CODE  (compiling 1 + &quot;cats&quot;)</text>
<text x="398" y="198" class="lbl" text-anchor="start">EMITTED</text>
<text x="570" y="198" class="lbl" text-anchor="start">TYPE STACK</text>
<rect class="box" x="20" y="206" width="366" height="150" rx="6"/>
<rect class="box" x="398" y="206" width="160" height="150" rx="6"/>
<rect class="box" x="570" y="206" width="190" height="150" rx="6"/>
<rect class="hl a11" x="24" y="220" width="358" height="22" rx="3"/>
<rect class="hl a12" x="24" y="244" width="358" height="22" rx="3"/>
<rect class="hl a13" x="24" y="268" width="358" height="22" rx="3"/>
