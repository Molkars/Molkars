<svg xmlns="http://www.w3.org/2000/svg" width="780" height="594" viewBox="0 0 780 594" role="img" aria-label="Diagram of flip syntax, using swap-job-in from a paging simulator. Functions are &#x27;name does … end-name&#x27;; &#x27;s and s&#x27; are property access; &#x27;s result calls a method and &#x27;do f of a &amp; b&#x27; calls a function; let&#x27;s … let&#x27;s-be-done is a block; strings choose their own delimiter with String X … X and comments start with NOTE:; loop over binds loop&#x27;s item; then chains statements; &#x27;hi x becomes it plus 1&#x27; reassigns using it for the old value.">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="tip"/></marker></defs>
