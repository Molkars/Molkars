<rect class="card" x="0.5" y="0.5" width="779" height="655" rx="8"/>
<text x="20" y="34" class="h" text-anchor="start">Notch — small syntax, strict where it matters</text>
<text x="20" y="54" class="m" text-anchor="start">Syntax I worked on in Notch, MSU&#x27;s scripting language. Every result below is from a real run.</text>
<rect class="box" x="20" y="76" width="740" height="526" rx="6"/>
<text x="34" y="103" class="lbl">STRINGS</text><text x="97" y="103" class="s">three ways to write one</text>
<rect class="hl a0" x="26" y="112" width="728" height="30" rx="4"/>
<text x="34" y="132" class="code sm a1" xml:space="preserve"><tspan class="cm">&gt; </tspan><tspan class="str">'single'</tspan></text>
<text x="452" y="132" class="code sm b  a2" xml:space="preserve">single</text>
<rect class="hl a3" x="26" y="146" width="728" height="30" rx="4"/>
<text x="34" y="166" class="code sm a4" xml:space="preserve"><tspan class="cm">&gt; </tspan><tspan class="str">"double"</tspan></text>
<text x="452" y="166" class="code sm b  a5" xml:space="preserve">double</text>
<rect class="hl a6" x="26" y="180" width="728" height="30" rx="4"/>
<text x="34" y="200" class="code sm a7" xml:space="preserve"><tspan class="cm">&gt; </tspan><tspan class="str">:terse</tspan></text>
<text x="452" y="194" class="code sm b  a8" xml:space="preserve">terse</text>
<text x="452" y="207" class="s a9">no quotes: ends at a space or , ) ] }</text>
<text x="34" y="241" class="lbl">MAPS</text><text x="74" y="241" class="s">terse keys, property-style reads</text>
<rect class="hl a10" x="26" y="250" width="728" height="30" rx="4"/>
<text x="34" y="270" class="code sm a11" xml:space="preserve"><tspan class="cm">&gt; </tspan>m = {<tspan class="str">:apples</tspan> -&gt; <tspan class="num">3</tspan>, <tspan class="str">:pears</tspan> -&gt; <tspan class="num">5</tspan>}</text>
<rect class="hl a12" x="26" y="284" width="728" height="30" rx="4"/>
<text x="34" y="304" class="code sm a13" xml:space="preserve"><tspan class="cm">&gt; </tspan>m.apples</text>
<text x="452" y="304" class="code sm b  a14" xml:space="preserve">3</text>
<rect class="hl a15" x="26" y="318" width="728" height="30" rx="4"/>
<text x="34" y="338" class="code sm a16" xml:space="preserve"><tspan class="cm">&gt; </tspan>m[<tspan class="str">:pears</tspan>]</text>
<text x="452" y="338" class="code sm b  a17" xml:space="preserve">5</text>
<text x="34" y="379" class="lbl">LOOPS</text><text x="82" y="379" class="s">count up without a range</text>
<rect class="hl a18" x="26" y="388" width="728" height="30" rx="4"/>
<text x="34" y="408" class="code sm a19" xml:space="preserve"><tspan class="cm">&gt; </tspan><tspan class="k">for </tspan>i &lt; <tspan class="num">4</tspan> <tspan class="f">print</tspan>(i * i) <tspan class="k">end</tspan></text>
<text x="452" y="402" class="code sm b  a20" xml:space="preserve">0  1  4  9</text>
<text x="452" y="415" class="s a21">i runs from 0 while i &lt; n</text>
<text x="34" y="449" class="lbl">MISSING VALUES</text><text x="150" y="449" class="s">variables and calls are strict, property reads coalesce</text>
<rect class="hl a22" x="26" y="458" width="728" height="30" rx="4"/>
<rect class="bad a23" x="446" y="460" width="302" height="26" rx="4" style="stroke-opacity:.4"/>
<text x="34" y="478" class="code sm a24" xml:space="preserve"><tspan class="cm">&gt; </tspan>foo</text>
<text x="452" y="472" class="code sm b badt a25" xml:space="preserve">✗ unknown variable "foo"</text>
<text x="452" y="485" class="s a26">a typo'd variable is an error …</text>
<rect class="hl a27" x="26" y="492" width="728" height="30" rx="4"/>
<text x="34" y="512" class="code sm a28" xml:space="preserve"><tspan class="cm">&gt; </tspan>foo?.bar.baz <tspan class="k">is undefined</tspan></text>
<text x="452" y="506" class="code sm b  a29" xml:space="preserve">true</text>
<text x="452" y="519" class="s a30">… unless you opt in with ?</text>
<rect class="hl a31" x="26" y="526" width="728" height="30" rx="4"/>
<text x="34" y="546" class="code sm a32" xml:space="preserve"><tspan class="cm">&gt; </tspan>foo?.bar.baz <tspan class="k">?:</tspan> <tspan class="str">:nope</tspan></text>
<text x="452" y="540" class="code sm b  a33" xml:space="preserve">nope</text>
<text x="452" y="553" class="s a34">?: turns &lt;undefined&gt; into a value</text>
<rect class="hl a35" x="26" y="560" width="728" height="30" rx="4"/>
<rect class="bad a36" x="446" y="562" width="302" height="26" rx="4" style="stroke-opacity:.4"/>
<text x="34" y="580" class="code sm a37" xml:space="preserve"><tspan class="cm">&gt; </tspan><tspan class="str">'hello'</tspan>.<tspan class="f">lenght</tspan>()</text>
<text x="452" y="574" class="code sm b badt a38" xml:space="preserve">✗ no method 'lenght' on String</text>
<text x="452" y="587" class="s a39">Did you mean 'length'?</text>
<path class="edge" d="M438 86 V592" style="stroke-width:1"/>
<text x="20" y="638" class="cap a40" text-anchor="start">Strings come in three flavours; terse ones are perfect for keys and names …</text>
<text x="20" y="638" class="cap a41" text-anchor="start">… which makes map literals read cleanly, and keys read like properties …</text>
<text x="20" y="638" class="cap a42" text-anchor="start">… for i &lt; n is the loop you reach for most, without building a range …</text>
<text x="20" y="638" class="cap a43" text-anchor="start">… and missing values fail loudly unless you opt in, with a suggestion when you misspell a method.</text>
</svg>
