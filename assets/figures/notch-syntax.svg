<svg xmlns="http://www.w3.org/2000/svg" width="780" height="656" viewBox="0 0 780 656" role="img" aria-label="Diagram of Notch syntax with real results. Strings: &#x27;single&#x27;, &quot;double&quot;, and quote-free :terse. Maps: {:apples -&gt; 3, :pears -&gt; 5} read with m.apples or m[:pears]. Loops: for i &lt; 4 counts 0 to 3, printing 0 1 4 9. Missing values: an unknown variable is an error, foo?.bar.baz coalesces to undefined, ?: supplies a fallback, and a misspelled method call errors with a suggestion.">
