<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Molkars Languages</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --line: #d1d9e0; --chip: #f6f8fa; --track: #eff2f5;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --line: #3d444d; --chip: #151b23; --track: #212830; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  main { max-width: 860px; margin: 0 auto; padding: 32px 16px 64px; }
  nav { display: flex; gap: 16px; margin-bottom: 24px; font-size: 13px; }
  nav a { color: var(--muted); text-decoration: none; }
  nav a[aria-current] { color: var(--fg); font-weight: 600; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 24px; }
  a { color: inherit; }
  .controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 20px; }
  .chip {
    border: 1px solid var(--line); background: var(--chip); color: var(--fg); border-radius: 999px;
    padding: 3px 10px; font: inherit; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  }
  .chip[aria-pressed="true"] { border-color: var(--fg); }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; }
  .chip .pct { color: var(--muted); font-variant-numeric: tabular-nums; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin-left: auto; }
  .seg button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13px; padding: 3px 10px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--chip); color: var(--fg); }
  .bar { display: flex; gap: 2px; height: 12px; border-radius: 4px; overflow: hidden; }
  .bar span { display: block; height: 100%; min-width: 2px; transition: opacity .15s, flex-basis .2s; }
  .total { margin-bottom: 28px; }
  .total .bar { height: 14px; }
  .repo { display: grid; grid-template-columns: 180px 1fr 64px; gap: 12px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); }
  .repo .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-decoration: none; font-weight: 600; }
  .repo .name:hover { text-decoration: underline; }
  .repo .size { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
  .repo .track { background: var(--track); border-radius: 4px; }
  .repo .note { grid-column: 2 / 4; color: var(--muted); font-size: 12px; margin-top: -4px; }
  .dim { opacity: .18; }
  #tip {
    position: fixed; pointer-events: none; background: var(--bg); color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 10px; font-size: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.12); display: none; z-index: 10;
  }
  #tip b { display: block; }
  #tip .m { color: var(--muted); font-variant-numeric: tabular-nums; }
  footer { margin-top: 28px; color: var(--muted); font-size: 12px; }
  @media (max-width: 560px) {
    .repo { grid-template-columns: 1fr 56px; }
    .repo .track { grid-column: 1 / 3; grid-row: 2; }
    .repo .note { grid-column: 1 / 3; margin-top: 0; }
    .seg { margin-left: 0; }
  }
</style>
</head>
<body>
<main>
  <nav><a href="./" aria-current="page">Languages</a><a href="code.html">Code</a><a href="https://github.com/Molkars">GitHub</a></nav>
  <h1>What I write</h1>
  <p class="sub">Bytes of code per language across my own (non-fork) repositories. Vendored code excluded. Hover a bar for details; click a language to highlight it.</p>

  <div class="total"><div class="bar" id="total" role="img"></div></div>

  <div class="controls" id="langs"></div>
  <div class="controls">
    <span class="sub" style="margin:0">Bar width:</span>
    <div class="seg" id="mode">
      <button data-mode="pct" aria-pressed="true">Share of repo</button>
      <button data-mode="abs" aria-pressed="false">Absolute size</button>
    </div>
  </div>

  <div id="repos"></div>
  <footer id="foot"></footer>
</main>
<div id="tip"></div>

<script>
const OTHER = "#8b949e";
const state = { focus: null, mode: "pct" };
let data;

const fmt = n => n >= 1e6 ? (n / 1e6).toFixed(1) + " MB" : n >= 1e3 ? (n / 1e3).toFixed(1) + " kB" : n + " B";
const sum = o => Object.values(o).reduce((a, b) => a + b, 0);
const color = l => data.colors[l] || OTHER;
const tip = document.getElementById("tip");

function showTip(e, html) {
  tip.innerHTML = html;
  tip.style.display = "block";
  const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8);
  tip.style.left = x + "px";
  tip.style.top = (e.clientY + 14) + "px";
}
const hideTip = () => tip.style.display = "none";

function segments(el, langs, title) {
  const total = sum(langs);
  el.innerHTML = "";
  for (const [lang, n] of Object.entries(langs)) {
    const s = document.createElement("span");
    s.style.flex = `${n} 1 0`;
    s.style.background = color(lang);
    s.dataset.lang = lang;
    const pct = (n / total * 100).toFixed(1);
    s.addEventListener("mousemove", e => showTip(e, `<b>${lang}</b><span class="m">${pct}% of ${title} · ${fmt(n)}</span>`));
    s.addEventListener("mouseleave", hideTip);
    s.addEventListener("click", () => setFocus(lang));
    el.appendChild(s);
  }
  el.setAttribute("aria-label", Object.entries(langs).map(([l, n]) => `${l} ${(n / total * 100).toFixed(1)}%`).join(", "));
}

function setFocus(lang) {
  state.focus = state.focus === lang ? null : lang;
  render();
}

function renderChips() {
  const host = document.getElementById("langs");
  const total = sum(data.totals);
  host.innerHTML = "";
  for (const [lang, n] of Object.entries(data.totals)) {
    const b = document.createElement("button");
    b.className = "chip";
    b.setAttribute("aria-pressed", state.focus === lang);
    b.innerHTML = `<span class="dot" style="background:${color(lang)}"></span>${lang} <span class="pct">${(n / total * 100).toFixed(1)}%</span>`;
    b.onclick = () => setFocus(lang);
    host.appendChild(b);
  }
}

function renderRepos() {
  const host = document.getElementById("repos");
  host.innerHTML = "";
  let repos = [...data.repos];
  if (state.focus) {
    const share = r => (r.languages[state.focus] || 0) / sum(r.languages);
    repos = repos.filter(r => r.languages[state.focus]).sort((a, b) => share(b) - share(a));
  }
  const max = Math.max(...repos.map(r => sum(r.languages)));
  for (const r of repos) {
    const total = sum(r.languages);
    const row = document.createElement("div");
    row.className = "repo";
    row.innerHTML = `<a class="name" href="${r.url}" title="${r.description.replace(/"/g, "&quot;")}">${r.name}</a>
      <div class="track"><div class="bar"></div></div><div class="size">${fmt(total)}</div>
      ${r.note ? `<div class="note">${r.note}</div>` : ""}`;
    const bar = row.querySelector(".bar");
    segments(bar, r.languages, r.name);
    bar.style.width = state.mode === "abs" ? Math.max(total / max * 100, 1) + "%" : "100%";
    host.appendChild(row);
  }
}

function render() {
  renderChips();
  renderRepos();
  for (const s of document.querySelectorAll(".bar span")) {
    s.classList.toggle("dim", !!state.focus && s.dataset.lang !== state.focus);
  }
}

document.getElementById("mode").addEventListener("click", e => {
  const m = e.target.dataset.mode;
  if (!m) return;
  state.mode = m;
  for (const b of e.currentTarget.children) b.setAttribute("aria-pressed", b.dataset.mode === m);
  render();
});

fetch("data.json").then(r => r.json()).then(d => {
  data = d;
  segments(document.getElementById("total"), d.totals, "all code");
  document.getElementById("foot").innerHTML =
    `${d.repos.length} repositories · regenerated weekly from the GitHub API · <a href="https://github.com/${d.user}">github.com/${d.user}</a>`;
  render();
});
</script>
</body>
</html>
